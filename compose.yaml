services:
  server:
    build:
      context: .
    env_file:
      - env/docker.env
    ports:
      - 8082:8082
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    env_file:
      - env/docker.env
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
